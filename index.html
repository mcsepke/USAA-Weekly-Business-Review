<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USAA · Weekly Support Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#071528;--panel:#0d2140;--line:rgba(255,255,255,.09);--teal:#03A7A8;--txt:#e8eef7;--muted:#93a3bb;--red:#e05260}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#0f2c52 0%,#071528 60%);
       color:#e8eef7;font-family:'Inter',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
  .lock{width:100%;max-width:400px;background:#0d2140;border:1px solid rgba(255,255,255,.09);border-radius:18px;
        padding:34px 30px 30px;box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center}
  .mark{width:74px;margin:0 auto 20px;display:block;background:#fff;border-radius:8px;padding:7px 9px}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#03A7A8;margin:0 0 8px}
  h1{font-size:17px;font-weight:600;margin:0 0 6px}
  p.sub{font-size:13px;color:#93a3bb;margin:0 0 22px;line-height:1.55}
  label{display:block;text-align:left;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;
        text-transform:uppercase;color:#93a3bb;margin-bottom:7px}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
        background:#071528;color:#e8eef7;font-family:'Inter',sans-serif;font-size:15px}
  input:focus{outline:2px solid #03A7A8;outline-offset:1px;border-color:transparent}
  button{width:100%;margin-top:14px;padding:12px 14px;border:0;border-radius:10px;background:#03A7A8;color:#042220;
         font-family:'Inter',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:filter .15s}
  button:hover{filter:brightness(1.08)}
  button[disabled]{opacity:.6;cursor:progress}
  .err{margin-top:13px;min-height:17px;font-size:12.5px;color:#e05260}
  .err.info{color:#93a3bb}
  .foot{margin-top:20px;padding-top:15px;border-top:1px solid rgba(255,255,255,.08);
        font-size:11px;color:#6f7f96;line-height:1.5}
  noscript{display:block;margin-top:14px;font-size:12.5px;color:#e05260}
</style>
</head>

    var password = pw.value;
    if(!password){ msg.className='err'; msg.textContent='Enter the password.'; pw.focus(); return; }
    go.disabled=true; msg.className='err info'; msg.textContent='Decrypting\u2026';
    try{
      var salt = b2a(SALT);
      var v = await bits(password, cat(salt, new TextEncoder().encode('verify')), 256);
      if(hex(v) !== VER){
        msg.className='err'; msg.textContent='Incorrect password.';
        go.disabled=false; pw.select(); return;
      }
      var kb = await bits(password, salt, 256);
      var key = await crypto.subtle.importKey('raw', kb, 'AES-GCM', false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b2a(IV)}, key, b2a(DATA));
      var html = new TextDecoder('utf-8').decode(plain);
      document.open(); document.write(html); document.close();
    }catch(e){
      msg.className='err'; msg.textContent='Could not decrypt this file.';
      go.disabled=false;
    }
  }

  go.addEventListener('click', unlock);
  pw.addEventListener('keydown', function(e){ if(e.key==='Enter') unlock(); });
})();
</script>
</body>
</html>
